on:
  schedule:
    - cron: '0 22 * * *'  # Daily at 22:00 UTC
  workflow_dispatch:
      
      - name: Debug secrets
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          echo "Account ID length: ${#MAXMIND_ACCOUNT_ID}"
          echo "License key length: ${#MAXMIND_LICENSE_KEY}"
