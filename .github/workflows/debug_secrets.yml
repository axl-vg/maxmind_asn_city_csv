name: Debug Secrets

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: MAXMIND_ACCOUNT_ID

    steps:
      - name: Debug secrets
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          echo "Account ID length: ${#MAXMIND_ACCOUNT_ID}"
          echo "License key length: ${#MAXMIND_LICENSE_KEY}"
          echo "First 3 chars of account ID: ${MAXMIND_ACCOUNT_ID:0:3}"
