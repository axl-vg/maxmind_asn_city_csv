name: MaxMind GeoLite2 CSV Processing (With Date Tracking)

on:
  schedule:
    - cron: '0 22 * * *'  # Daily at 22:00 UTC
  workflow_dispatch:

jobs:
  process-geolite2:
    runs-on: ubuntu-latest
    environment: MAXMIND_ACCOUNT_ID

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create work directory
        run: mkdir -p ${{ runner.temp }}/geolite2

      - name: Check for updates
        id: check_update
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          cd ${{ runner.temp }}/geolite2

          CITY_MODIFIED=$(curl -sI -L \
            -u "${MAXMIND_ACCOUNT_ID}:${MAXMIND_LICENSE_KEY}" \
            'https://download.maxmind.com/geoip/databases/GeoLite2-City-CSV/download?suffix=tar.gz' | \
            grep -i "Last-Modified" | cut -d' ' -f2-)

          ASN_MODIFIED=$(curl -sI -L \
            -u "${MAXMIND_ACCOUNT_ID}:${MAXMIND_LICENSE_KEY}" \
            'https://download.maxmind.com/geoip/databases/GeoLite2-ASN-CSV/download?suffix=tar.gz' | \
            grep -i "Last-Modified" | cut -d' ' -f2-)

          echo "City data modified: $CITY_MODIFIED"
          echo "ASN data modified: $ASN_MODIFIED"
          echo "city_modified=$CITY_MODIFIED" >> $GITHUB_OUTPUT
          echo "asn_modified=$ASN_MODIFIED" >> $GITHUB_OUTPUT

          CITY_DATE=$(echo "$CITY_MODIFIED" | awk '{print $3, $4, $5}' | xargs -I {} date -d "{}" +%Y-%m-%d 2>/dev/null || echo "unknown")
          echo "CITY_DATE=$CITY_DATE" >> $GITHUB_OUTPUT

      - name: Download MaxMind ASN data
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          cd ${{ runner.temp }}/geolite2
          echo "Downloading GeoLite2-ASN..."
          curl -f -L \
            -u "${MAXMIND_ACCOUNT_ID}:${MAXMIND_LICENSE_KEY}" \
            "https://download.maxmind.com/geoip/databases/GeoLite2-ASN-CSV/download?suffix=tar.gz" \
            -o GeoLite2-ASN.tar.gz

          if ! gzip -t GeoLite2-ASN.tar.gz 2>/dev/null; then
            echo "ERROR: Not a valid gzip. Response was:"
            cat GeoLite2-ASN.tar.gz
            exit 1
          fi
          echo "ASN download successful: $(du -h GeoLite2-ASN.tar.gz)"

      - name: Download MaxMind City data
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          cd ${{ runner.temp }}/geolite2
          echo "Downloading GeoLite2-City..."
          curl -f -L \
            -u "${MAXMIND_ACCOUNT_ID}:${MAXMIND_LICENSE_KEY}" \
            "https://download.maxmind.com/geoip/databases/GeoLite2-City-CSV/download?suffix=tar.gz" \
            -o GeoLite2-City.tar.gz

          if ! gzip -t GeoLite2-City.tar.gz 2>/dev/null; then
            echo "ERROR: Not a valid gzip. Response was:"
            cat GeoLite2-City.tar.gz
            exit 1
          fi
          echo "City download successful: $(du -h GeoLite2-City.tar.gz)"

      - name: Extract archives
        run: |
          cd ${{ runner.temp }}/geolite2
          tar -xzf GeoLite2-ASN.tar.gz
          tar -xzf GeoLite2-City.tar.gz

          ASN_DIR=$(find . -maxdepth 1 -type d -name 'GeoLite2-ASN*' | head -1)
          CITY_DIR=$(find . -maxdepth 1 -type d -name 'GeoLite2-City*' | head -1)

          echo "ASN_DIR=${{ runner.temp }}/geolite2/${ASN_DIR#./}" >> $GITHUB_ENV
          echo "CITY_DIR=${{ runner.temp }}/geolite2/${CITY_DIR#./}" >> $GITHUB_ENV
          echo "WORK_DIR=${{ runner.temp }}/geolite2" >> $GITHUB_ENV

      - name: Verify extracted files
        run: |
          echo "=== ASN Directory ===" && ls -lah "${{ env.ASN_DIR }}"
          echo "=== City Directory ===" && ls -lah "${{ env.CITY_DIR }}"

      - name: Step 1 - Geo + exact ASN join with gawk
        run: |
          cd ${{ env.WORK_DIR }}

          gawk -F, '
          BEGIN { OFS="," }

          FILENAME ~ /ASN/ {
              if (FNR == 1) next
              gsub(/"/, "", $3)
              asn[$1] = $2 "," $3
              next
          }

          FILENAME ~ /Locations/ {
              if (FNR == 1) next
              loc[$1] = $3 "," $4 "," $5 "," $6 "," $7 "," $8 "," $11
              next
          }

          FNR == 1 { next }
          {
              network = $1; geoname = $2
              city=""; state=""; state_code=""; country=""
              country_code=""; continent=""; continent_code=""
              if (geoname in loc) {
                  split(loc[geoname], gp, ",")
                  continent_code=gp[1]; continent=gp[2]
                  country_code=gp[3];   country=gp[4]
                  state_code=gp[5];     state=gp[6]
                  city=gp[7]
              }
              gsub(/"/, "", state); gsub(/"/, "", city)
              gsub(/"/, "", country); gsub(/"/, "", continent)
              asn_num=""; asn_org=""
              if (network in asn) {
                  split(asn[network], ap, ",")
                  asn_num=ap[1]; asn_org=ap[2]
              }
              if (!printed_header) {
                  print "ip_range,city,state,state_code,country,country_code,continent,continent_code,asn,asn_name"
                  printed_header=1
              }
              print network "," city "," state "," state_code "," country "," country_code "," continent "," continent_code "," asn_num "," asn_org
          }
          ' \
          "${{ env.ASN_DIR }}/GeoLite2-ASN-Blocks-IPv4.csv" \
          "${{ env.ASN_DIR }}/GeoLite2-ASN-Blocks-IPv6.csv" \
          "${{ env.CITY_DIR }}/GeoLite2-City-Locations-en.csv" \
          "${{ env.CITY_DIR }}/GeoLite2-City-Blocks-IPv4.csv" \
          "${{ env.CITY_DIR }}/GeoLite2-City-Blocks-IPv6.csv" \
          > merged_pass1.csv

          echo "Pass 1 complete: $(wc -l < merged_pass1.csv) rows"

      - name: Step 2 - LPM ASN fill via Python
        run: |
          cd ${{ env.WORK_DIR }}

          python3 - "${{ env.ASN_DIR }}/GeoLite2-ASN-Blocks-IPv4.csv" \
                    "${{ env.ASN_DIR }}/GeoLite2-ASN-Blocks-IPv6.csv" \
                    merged_pass1.csv \
                    merged_geoip.csv << 'PYEOF'
          import sys, csv, bisect
          from ipaddress import ip_network

          asn4_nets, asn4_data = [], []
          asn6_nets, asn6_data = [], []

          print("  Loading ASN tables...")
          for fname in sys.argv[1:3]:
              with open(fname) as f:
                  for row in csv.reader(f):
                      if row[0] == 'network':
                          continue
                      try:
                          net = ip_network(row[0], strict=False)
                          org = row[2].strip('"')
                          if net.version == 4:
                              asn4_nets.append(int(net.network_address))
                              asn4_data.append((int(net.network_address), int(net.broadcast_address), row[1], org))
                          else:
                              asn6_nets.append(int(net.network_address))
                              asn6_data.append((int(net.network_address), int(net.broadcast_address), row[1], org))
                      except Exception:
                          pass

          print(f"  IPv4 ASN entries: {len(asn4_nets)}, IPv6: {len(asn6_nets)}")

          def lpm_lookup(ip_int, nets, data):
              idx = bisect.bisect_right(nets, ip_int) - 1
              best = ("", "")
              best_len = -1
              for i in range(idx, max(idx - 64, -1), -1):
                  start, end, num, org = data[i]
                  if start <= ip_int <= end:
                      prefix_len = end - start
                      if best_len == -1 or prefix_len < best_len:
                          best_len = prefix_len
                          best = (num, org)
              return best

          print("  Processing rows...")
          infile  = sys.argv[3]
          outfile = sys.argv[4]

          with open(infile) as fin, open(outfile, 'w', newline='') as fout:
              reader = csv.reader(fin)
              writer = csv.writer(fout, quoting=csv.QUOTE_MINIMAL)
              for i, row in enumerate(reader):
                  if i == 0:
                      writer.writerow(row)
                      continue
                  if i % 500000 == 0:
                      print(f"  {i} rows done...")
                  if row[8] == '' and row[0]:
                      try:
                          net = ip_network(row[0], strict=False)
                          ip_int = int(net.network_address)
                          if net.version == 4:
                              asn_num, asn_org = lpm_lookup(ip_int, asn4_nets, asn4_data)
                          else:
                              asn_num, asn_org = lpm_lookup(ip_int, asn6_nets, asn6_data)
                          row[8] = asn_num
                          row[9] = asn_org
                      except Exception:
                          pass
                  writer.writerow(row)

          print("  Done.")
          PYEOF

          echo "Pass 2 complete: $(wc -l < merged_geoip.csv) rows"

      - name: Verify and compress output
        id: compress
        run: |
          cd ${{ env.WORK_DIR }}

          LINES=$(wc -l < merged_geoip.csv)
          echo "Line count: $LINES"
          echo "Uncompressed: $(du -h merged_geoip.csv)"

          zip -9 maxmind-geolite2-city-asn-csv.zip merged_geoip.csv
          ZIPPED_SIZE=$(du -h maxmind-geolite2-city-asn-csv.zip | cut -f1)

          echo "Compressed: $ZIPPED_SIZE"
          echo "lines=$LINES" >> $GITHUB_OUTPUT
          echo "compressed_size=$ZIPPED_SIZE" >> $GITHUB_OUTPUT

      - name: Create release with date tag
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.WORK_DIR }}/maxmind-geolite2-city-asn-csv.zip
          tag_name: geolite2-${{ steps.check_update.outputs.CITY_DATE || github.run_id }}
          target_commitish: ${{ github.sha }}
          body: |
            # MaxMind GeoLite2 City + ASN Merged Dataset

            **Generated**: ${{ github.run_id }} UTC
            **Data Date**: ${{ steps.check_update.outputs.CITY_DATE }}

            ## File Details
            - **Lines**: ${{ steps.compress.outputs.lines }}
            - **Compressed Size**: ${{ steps.compress.outputs.compressed_size }}
            - **Format**: CSV (UTF-8)
            - **Encoding**: Minimal quoting

            ## Columns
            ```
            ip_range, city, state, state_code, country, country_code,
            continent, continent_code, asn, asn_name
            ```

            ## Contents
            - GeoLite2 City: IPv4 + IPv6 blocks with location data
            - GeoLite2 ASN: IPv4 + IPv6 blocks with ASN organization names
            - **Processing**: Exact join on blocks + Longest Prefix Match for missing ASNs

            ## Download
            ```bash
            wget $(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.assets[0].browser_download_url')
            ```
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up temp files
        if: always()
        run: |
          rm -rf ${{ runner.temp }}/geolite2
          echo "Cleaned up temporary files"
